<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composant - Carte de Prix</title>
<style>
/* --- Variables globales pour une réutilisation facile --- */
:root {
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --primary-color: #6366f1;
    --primary-hover: #4f46e5;
    --price-color: #10b981;
    --border-color: #f1f5f9;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
}

/* --- Style de la page (centre le composant) --- */
body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background-color: #f8fafc;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

/* --- Composant : Carte de Prix (Modulaire) --- */
.pricing-card {
    background-color: var(--card-bg);
    width: 100%;
    max-width: 320px;
    border-radius: 1.25rem;
    box-shadow: var(--shadow);
    padding: 2rem;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.pricing-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 30px -10px rgba(99, 102, 241, 0.15);
}

/* --- En-tête de la carte ---. */
.pricing-header {
    text-align: left;
}

.pricing-title {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 0 0 0.5rem 0;
}

.pricing-price {
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--price-color);
    margin: 0;
}

.pricing-price span {
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--text-muted);
}

/* --- Liste des fonctionnalités --- */
.pricing-features {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}

.pricing-features li {
    font-size: 0.95rem;
    color: var(--text-muted);
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

/* Optionnel : Ajout d'une petite icône "Check" visuelle pour l'ergonomie */
.pricing-features li::before {
    content: "✓";
    color: var(--primary-color);
    font-weight: bold;
}

.pricing-features li:last-child {
    border-bottom: none;
    padding-bottom: 0;
}

/* --- Bouton d'action --- */
.pricing-btn {
    background-color: var(--primary-color);
    color: #ffffff;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 0.75rem;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.2s ease;
    width: 100%;
}

.pricing-btn:hover {
    background-color: var(--primary-hover);
    transform: scale(1.02);
}

.pricing-btn:active {
    transform: scale(0.98);
}
</style>
</head>
<body>

<!-- Composant de carte de prix propre et prêt à être réutilisé -->
<div class="pricing-card">
    <div class="pricing-header">
        <h2 class="pricing-title">Forfait de base</h2>
        <p class="pricing-price">9,99 € <span>/ mois</span></p>
    </div>

    <ul class="pricing-features">
        <li>1 Go de stockage</li>
        <li>Assistance de base</li>
        <li>Toutes les fonctionnalités principales</li>
    </ul>

    <button class="pricing-btn">Démarrer l'essai</button>
</div>

</body>
</html>
